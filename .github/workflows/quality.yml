name: Quality checks and Pages

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  publication-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Stage checked public files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: site
        run: node scripts/code-quality/stage-site.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publication-quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
